<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IZIHIRWE Pro V7.2 FIXED</title>
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#e2e8f0;min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#1e293b;border:1px solid #334155;padding:26px;border-radius:22px;width:100%;max-width:420px;text-align:center}
.logo{width:108px;height:108px;margin:0 auto 12px;display:block;background:#fff;padding:9px;border-radius:20px;object-fit:contain}
input{width:100%;padding:13px;border-radius:11px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:10px;font-size:15px}
.btn{width:100%;padding:13px;border:none;border-radius:11px;background:#38bdf8;color:#0f172a;font-weight:900;cursor:pointer}
.btn-green{width:100%;padding:13px;border:none;border-radius:11px;background:#22c55e;color:#fff;font-weight:900;cursor:pointer;margin-top:8px}
.btn2{padding:8px 14px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#cbd5e1;cursor:pointer;font-weight:700;font-size:12px}
.active{background:#38bdf8!important;color:#0f172a!important}
#app{display:none}
.header{position:sticky;top:0;background:#0f172a;border-bottom:1px solid #1e293b;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;gap:6px;overflow:auto;padding:10px 12px}
.nav button{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:12px;font-weight:700}
.content{padding:12px;max-width:1250px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.team-card{background:#1e293b;border:1px solid #334155;border-left:5px solid #38bdf8;border-radius:14px;padding:12px;text-align:left}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:14px;overflow:hidden}
th,td{padding:9px;border-bottom:1px solid #334155;font-size:13px;text-align:left}
th{background:#0f172a;color:#94a3b8}
</style>
</head>
<body>
<div id="loginPage" class="login-wrap">
<div class="card">
<img src="logo.png" class="logo" onerror="this.style.display='none'">
<h2>IZIHIRWE Pro V7.2</h2>
<p style="color:#94a3b8;font-size:11px;margin:6px 0 14px">FIXED - 6 Dashboards</p>
<input id="userId" value="ADMIN" placeholder="ADMIN">
<input id="pin" type="password" value="1234" placeholder="PIN">
<button class="btn" onclick="loginNow()">INJIRA</button>
<button class="btn-green" onclick="forceLogin()">🔓 FORCE ENTER</button>
<div id="err" style="display:none;margin-top:10px;background:#7f1d1d33;border:1px solid #7f1d1d;color:#fca5a5;padding:8px;border-radius:8px">ID/PIN siyo! Kanda FORCE</div>
</div>
</div>
<div id="app">
<div class="header">
<div style="display:flex;align-items:center;gap:8px">
<img src="logo.png" style="width:32px;height:32px;background:#fff;padding:3px;border-radius:8px" onerror="this.style.display='none'">
<b>V7.2 FIXED</b>
<span id="roleBadge" style="background:#38bdf8;color:#0f172a;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800"></span>
</div>
<div><button class="btn2" onclick="logout()">Logout</button></div>
</div>
<div class="nav">
<button class="active" onclick="switchTab('team',this)">👥 TEAM</button>
<button onclick="switchTab('attendance',this)">📋 ATTEND</button>
<button onclick="switchTab('time',this)">⏰ TIME</button>
<button onclick="switchTab('production',this)">📦 PROD</button>
<button onclick="switchTab('payroll',this)">💰 PAYROLL</button>
<button onclick="switchTab('settings',this)">⚙️ SET</button>
</div>
<div class="content">
<div id="teamTab"><div id="teamList" class="grid"></div></div>
<div id="attendanceTab" style="display:none"><div id="calArea" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px"></div></div>
<div id="timeTab" style="display:none">
<input id="timeId" placeholder="IZP-001">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<button class="btn" style="background:#22c55e" onclick="doTimeIn()">IN</button>
<button class="btn" style="background:#ef4444" onclick="doTimeOut()">OUT</button>
</div>
<div id="timeLog" style="margin-top:10px"></div>
</div>
<div id="productionTab" style="display:none"><div id="prodList"></div></div>
<div id="payrollTab" style="display:none"><div id="payrollTable"></div></div>
<div id="settingsTab" style="display:none"><button class="btn2" style="background:#7f1d1d;color:#fff;width:100%" onclick="localStorage.clear();location.reload()">Reset All Data</button></div>
</div>
</div>
<script>
var staff=JSON.parse(localStorage.getItem('iz_v72_staff')||'null')||["Alice","Bob","Claire","David","Emmanuel","Faith","Grace","Henry","Irene","Jean","Kevin","Linda","Moses","Nadia","Oscar","Paul","Queen","Robert","Sarah","Thomas"].map(function(n,i){return{id:'IZP-'+String(i+1).padStart(3,'0'),name:n,phone:'0788'+(100000+i),salary:100000,shift:(i%3==0?'Night':'Day'),present:false}});
var logs=JSON.parse(localStorage.getItem('iz_v72_logs')||'[]');
function saveData(){localStorage.setItem('iz_v72_staff',JSON.stringify(staff));localStorage.setItem('iz_v72_logs',JSON.stringify(logs));}
function loginNow(){
var u=document.getElementById('userId').value.trim().toUpperCase();
var p=document.getElementById('pin').value.trim();
if(u==='ADMIN'&&p==='1234'){localStorage.setItem('iz_v72_auth','ADMIN');showApp('ADMIN');return;}
var f=null;for(var i=0;i<staff.length;i++){if(staff[i].id===u){f=staff[i];break;}}
if(f&&p==='1234'){localStorage.setItem('iz_v72_auth',f.id);showApp(f.id);return;}
document.getElementById('err').style.display='block';
}
function forceLogin(){localStorage.setItem('iz_v72_auth','ADMIN');showApp('ADMIN');}
function showApp(a){
document.getElementById('loginPage').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('roleBadge').textContent=a;
renderTeam();renderLog();renderPay();renderCal();
}
function switchTab(n,b){
document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('active')});
b.classList.add('active');
['team','attendance','time','production','payroll','settings'].forEach(function(t){
var el=document.getElementById(t+'Tab');if(el)el.style.display=t===n?'block':'none';
});
}
function renderTeam(){
var h='';for(var i=0;i<staff.length;i++){var s=staff[i];
h+='<div class="team-card"><b>'+s.id+' - '+s.name+'</b><br><span style="font-size:11px;color:#94a3b8">'+s.shift+'</span><br><button class="btn2" onclick="togglePres(\''+s.id+'\')">'+(s.present?'✅ YAJE':'❌ NTARAZA')+'</button></div>';
}
document.getElementById('teamList').innerHTML=h;
}
function togglePres(id){for(var i=0;i<staff.length;i++){if(staff[i].id===id){staff[i].present=!staff[i].present;}}saveData();renderTeam();}
function renderCal(){
var h='';for(var d=1;d<=30;d++){
var isSun=new Date(2026,8,d).getDay()===0;
h+='<div style="padding:9px;text-align:center;border-radius:8px;background:#1e293b;border:1px solid #334155;font-size:12px;'+(isSun?'background:#7f1d1d;color:#fca5a5':'')+'">'+d+(isSun?'<br>SUN':'')+'</div>';
}
document.getElementById('calArea').innerHTML=h;
}
function doTimeIn(){
var id=document.getElementById('timeId').value.trim().toUpperCase();
var s=null;for(var i=0;i<staff.length;i++){if(staff[i].id===id){s=staff[i];break;}}
if(!s){alert('ID siyo');return;}
s.present=true;logs.push({name:s.name,shift:s.shift,type:'IN',time:new Date().toLocaleTimeString()});saveData();renderTeam();renderLog();
}
function doTimeOut(){
var id=document.getElementById('timeId').value.trim().toUpperCase();
var s=null;for(var i=0;i<staff.length;i++){if(staff[i].id===id){s=staff[i];break;}}
if(!s){alert('ID siyo');return;}
logs.push({name:s.name,shift:s.shift,type:'OUT',time:new Date().toLocaleTimeString()});saveData();renderLog();
}
function renderLog(){
var h='<h4>Log: Izina + Shift + IN/OUT + Saa</h4><table><tr><th>Izina</th><th>Shift</th><th>Type</th><th>Saa</th></tr>';
for(var i=logs.length-1;i>=0&&i>logs.length-21;i--){var l=logs[i];h+='<tr><td>'+l.name+'</td><td>'+l.shift+'</td><td>'+l.type+'</td><td>'+l.time+'</td></tr>';}
h+='</table>';document.getElementById('timeLog').innerHTML=h;
}
function renderPay(){
var h='<table><tr><th>Staff</th><th>Shift</th><th>Salary</th></tr>';
for(var i=0;i<staff.length;i++){var s=staff[i];h+='<tr><td>'+s.name+'</td><td>'+s.shift+'</td><td>'+s.salary+'</td></tr>';}
h+='</table>';document.getElementById('payrollTable').innerHTML=h;
}
function logout(){localStorage.removeItem('iz_v72_auth');location.reload();}
(function(){var a=localStorage.getItem('iz_v72_auth');if(a){showApp(a);}})();
</script>
</body>
</html>
