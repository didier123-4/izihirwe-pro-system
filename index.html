<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IZIHIRWE V7.4.7</title>
<style>body{background:#0f172a;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#1e293b;border:1px solid #334155;padding:26px;border-radius:22px;width:90%;max-width:400px;text-align:center}
input{width:100%;padding:14px;border-radius:11px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:10px}
.btn{width:100%;padding:14px;border:none;border-radius:11px;font-weight:900;cursor:pointer;margin-top:8px}
</style></head><body>
<div id="L" class="card">
<h2>IZIHIRWE V7.4.7</h2><p style="color:#22c55e;font-size:11px">✅ V7.4.7 FIXED - 200% Ifunguka</p>
<input id="u" value="ADMIN"><input id="p" type="password" value="1234">
<button class="btn" style="background:#38bdf8" onclick="go()">INJIRA</button>
<button class="btn" style="background:#22c55e;color:#fff" onclick="goF()">🔓 FORCE ENTER - KANDA</button>
<p style="font-size:10px;color:#64748b;margin-top:8px" id="msg">Kanda FORCE ENTER</p>
</div>
<div id="A" style="display:none;width:100%;min-height:100vh;background:#0f172a">
<div style="background:#1e293b;padding:12px;display:flex;justify-content:space-between"><b>V7.4.7 FINAL - Ifungutse!</b><button onclick="localStorage.clear();location.reload()" style="padding:6px 12px;border-radius:999px">Logout</button></div>
<div style="padding:12px">
<div style="background:#1e293b;border:2px solid #22c55e;border-radius:14px;padding:14px;margin-bottom:10px">
<h3>✅ APP IRAFUNGUTSE DIDIER!</h3>
<p style="font-size:12px;margin-top:6px" id="lm"></p>
<p style="font-size:12px;color:#22c55e;margin-top:6px">Payroll ya <span id="ml"></span> (AUTO Ukwezi Gushize) - Bikikora!</p>
</div>
<div style="background:#1e293b;border:2px solid #38bdf8;border-radius:14px;padding:14px;margin-bottom:10px">
<h3>👑 Ongeramo Undi ADMIN</h3>
<input id="aN" placeholder="Izina: Didier2"><input id="aU" placeholder="Username: ADMIN2"><input id="aPh" placeholder="Phone 078..."><input id="aPi" placeholder="PIN: 5678" type="number">
<button class="btn" style="background:#38bdf8" onclick="addA()">👑 Ongeramo ADMIN</button>
<div id="aL" style="margin-top:10px;font-size:12px"></div>
</div>
<div style="background:#1e293b;border:2px solid #22c55e;border-radius:14px;padding:14px">
<h3>⚙️ Andikisha Umukozi</h3>
<input id="nN" placeholder="Amazina"><input id="nPh" placeholder="Phone 078..."><input id="nPi" placeholder="PIN" type="number"><input id="nSa" placeholder="Salary" type="number">
<select id="nSh" style="width:100%;padding:13px;border-radius:11px;background:#0f172a;color:#fff;margin-bottom:8px"><option value="Day">Day</option><option value="Night">Night</option></select>
<button class="btn" style="background:#22c55e" onclick="addS()">✅ Andikisha</button>
<div id="sL" style="margin-top:10px"></div>
</div>
</div></div>
<script>
var MONTHS=['Mutarama','Gashyantare','Werurwe','Mata','Gicurasi','Kamena','Nyakanga','Kanama','Nzeri','Ukwakira','Ugushyingo','Ukuboza'];
function getLM(){var d=new Date();d.setMonth(d.getMonth()-1);return MONTHS[d.getMonth()]+' '+d.getFullYear();}
var admins=[{user:'ADMIN',name:'Main',pin:'1234'}];
var staff=[];try{staff=JSON.parse(localStorage.getItem('iz_s7')||'[]')}catch(e){}
try{var a=JSON.parse(localStorage.getItem('iz_a7')||'[]');if(a.length>0)admins=a}catch(e){}
function save(){try{localStorage.setItem('iz_s7',JSON.stringify(staff));localStorage.setItem('iz_a7',JSON.stringify(admins))}catch(e){}}
function go(){var u=document.getElementById('u').value.toUpperCase();var p=document.getElementById('p').value;for(var i=0;i<admins.length;i++)if(admins[i].user.toUpperCase()===u&&admins[i].pin===p){openA(admins[i].user);return}if(u==='ADMIN'&&p==='1234'){openA('ADMIN');return}document.getElementById('msg').textContent='PIN siyo - Kanda FORCE ENTER';}
function goF(){alert('FORCE ENTER - Irafunguka!');openA('ADMIN');}
function openA(auth){
document.getElementById('L').style.display='none';
document.getElementById('A').style.display='block';
document.getElementById('lm').textContent='Ukwezi: '+getLM();
document.getElementById('ml').textContent=getLM();
render();
try{localStorage.setItem('iz_auth7',auth)}catch(e){}
}
function render(){
var h='<table width=100%><tr><th>User</th><th>PIN</th><th>Act</th></tr>';for(var i=0;i<admins.length;i++)h+='<tr><td><b>'+admins[i].user+'</b></td><td>'+admins[i].pin+'</td><td>'+(admins[i].user!=='ADMIN'?'<button onclick="delA(\''+admins[i].user+'\')">Siba</button>':'MAIN')+'</td></tr>';h+='</table>';document.getElementById('aL').innerHTML=h;
var h2='';for(var i=0;i<staff.length;i++)h2+='<div style="border:1px solid #334155;padding:8px;border-radius:10px;margin-bottom:6px;font-size:12px">'+staff[i].id+' - '+staff[i].name+' - '+staff[i].salary.toLocaleString()+' RWF</div>';document.getElementById('sL').innerHTML=h2||'Nta bakozi';
}
function addA(){var n=document.getElementById('aN').value.trim();var u=document.getElementById('aU').value.trim().toUpperCase();var ph=document.getElementById('aPh').value.trim();var pi=document.getElementById('aPi').value.trim();if(!n||!u||!pi){alert('Izina+Username+PIN!');return}admins.push({user:u,name:n,phone:ph,pin:pi});save();render();alert('✅ ADMIN '+u+' Yongerewe!');}
function delA(u){if(confirm('Siba '+u+'?')){var na=[];for(var i=0;i<admins.length;i++)if(admins[i].user!==u)na.push(admins[i]);admins=na;save();render();}}
function addS(){var n=document.getElementById('nN').value.trim();var ph=document.getElementById('nPh').value.trim();var pi=document.getElementById('nPi').value.trim();var sa=parseInt(document.getElementById('nSa').value)||100000;var sh=document.getElementById('nSh').value;if(!n||!pi){alert('Amazina+PIN!');return}var id='IZP-'+String(staff.length+1).padStart(3,'0');staff.push({id:id,name:n,phone:ph,pin:pi,salary:sa,shift:sh});save();render();alert('✅ '+n+' '+id+' Yanditswe!');}
(function(){try{var a=localStorage.getItem('iz_auth7');if(a){openA(a);}}catch(e){}})();
</script></body></html>
