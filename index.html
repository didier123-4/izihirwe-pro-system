<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#e2e8f0;min-height:100vh}
.card{background:#1e293b;border:1px solid #334155;padding:26px;border-radius:22px;width:90%;max-width:420px;text-align:center}

</style></head><body>
<div id="L" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px"><div class="card">

</div></div>

</div>

<input id="aN" placeholder="Izina: Didier2"><input id="aU" placeholder="Username: ADMIN2"><input id="aPh" placeholder="Phone 078..."><input id="aPi" placeholder="PIN: 5678" type="number">

</div>

<script>
var MONTHS=['Mutarama','Gashyantare','Werurwe','Mata','Gicurasi','Kamena','Nyakanga','Kanama','Nzeri','Ukwakira','Ugushyingo','Ukuboza'];
function getLM(){var d=new Date();d.setMonth(d.getMonth()-1);return MONTHS[d.getMonth()]+' '+d.getFullYear();}
var staff=[{id:'IZP-001',name:'Alice',phone:'0788100001',pin:'1001',salary:120000,shift:'Night',present:false},{id:'IZP-002',name:'Bob',phone:'0788100002',pin:'1002',salary:100000,shift:'Day',present:false},{id:'IZP-003',name:'Claire',phone:'0788100003',pin:'1003',salary:100000,shift:'Day',present:false},{id:'IZP-004',name:'David',phone:'0788100004',pin:'1004',salary:110000,shift:'Night',present:false},{id:'IZP-005',name:'Emmanuel',phone:'0788100005',pin:'1005',salary:100000,shift:'Day',present:false},{id:'IZP-006',name:'Faith',phone:'0788100006',pin:'1006',salary:100000,shift:'Day',present:false},{id:'IZP-007',name:'Grace',phone:'0788100007',pin:'1007',salary:100000,shift:'Day',present:false},{id:'IZP-008',name:'Henry',phone:'0788100008',pin:'1008',salary:100000,shift:'Night',present:false},{id:'IZP-009',name:'Irene',phone:'0788100009',pin:'1009',salary:100000,shift:'Day',present:false},{id:'IZP-010',name:'Jean',phone:'0788100010',pin:'1010',salary:100000,shift:'Day',present:false}];
var admins=[{user:'ADMIN',name:'Main Admin',phone:'0780000000',pin:'1234'}];
var logs=[];var avs=[];var auth='';
try{var x=localStorage.getItem('iz_a8');if(x)admins=JSON.parse(x);}catch(e){}
try{var x=localStorage.getItem('iz_s8');if(x&&JSON.parse(x).length>0)staff=JSON.parse(x);}catch(e){}
try{var x=localStorage.getItem('iz_l8');if(x)logs=JSON.parse(x);}catch(e){}
try{var x=localStorage.getItem('iz_v8');if(x)avs=JSON.parse(x);}catch(e){}
function save(){try{localStorage.setItem('iz_s8',JSON.stringify(staff));localStorage.setItem('iz_a8',JSON.stringify(admins));localStorage.setItem('iz_l8',JSON.stringify(logs));localStorage.setItem('iz_v8',JSON.stringify(avs));localStorage.setItem('iz_auth8',auth);}catch(e){}}
function isAdmin(){for(var i=0;i<admins.length;i++)if(admins[i].user===auth)return true;return false;}
function getMe(){for(var i=0;i<staff.length;i++)if(staff[i].id===auth)return staff[i];return null;}
function login(){var u=document.getElementById('u').value.trim().toUpperCase();var p=document.getElementById('p').value.trim();for(var i=0;i<admins.length;i++)if(admins[i].user.toUpperCase()===u&&admins[i].pin===p){openApp(admins[i].user);return}for(var i=0;i<staff.length;i++)if(staff[i].id===u&&staff[i].pin===p){openApp(staff[i].id);return}alert('PIN siyo - Kanda FORCE ENTER');}
function force(){openApp('ADMIN');}
function openApp(a){auth=a;document.getElementById('L').style.display='none';document.getElementById('A').style.display='block';document.getElementById('badge').textContent=a;var lm=getLM();document.getElementById('mHead').textContent=lm;var els=document.querySelectorAll('.ml');for(var i=0;i<els.length;i++)els[i].textContent=lm;save();applyPermissions();renderAll();}
function applyPermissions(){var admin=isAdmin();document.getElementById('adminBox').style.display=admin?'block':'none';document.getElementById('staffBox').style.display=admin?'block':'none';document.getElementById('empAvBox').style.display=admin?'none':'block';}
function openTab(n,b){var bs=document.querySelectorAll('.nav button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('active');b.classList.add('active');var ts=['team','time','prod','payroll','settings'];for(var i=0;i<ts.length;i++)document.getElementById(ts[i]+'Tab').style.display=ts[i]===n?'block':'none';}
function renderAll(){renderTeam();renderTime();renderProd();renderAv();renderPay();renderAdmins();renderEmpAv();}
function renderTeam(){var admin=isAdmin();var me=getMe();var list=admin?staff:(me?staff.filter(function(s){return s.shift===me.shift}):[]);document.getElementById('teamInfo').textContent=admin?'Bose: '+staff.length+' | ADMIN: '+auth+' | '+getLM()+' AUTO':'Shift yawe ('+(me?me.shift:'')+'): '+list.length+' | '+getLM()+' | NTABONA ABANDI';var h='';for(var i=0;i<list.length;i++){var s=list[i];var av=0;for(var j=0;j<avs.length;j++)if(avs[j].id===s.id&&avs[j].status==='APPROVED')av+=avs[j].amount;h+='<div class="team-card"><b>'+s.id+' - '+s.name+'</b><br><span style="font-size:11px">'+s.shift+' | '+s.phone+' | PIN:'+s.pin+'</span><br><span style="font-size:11px">Sal:'+s.salary.toLocaleString()+' Av:-'+av.toLocaleString()+' Net:<b>'+(s.salary-av).toLocaleString()+'</b></span><br><div style="margin-top:8px"><button onclick="tog(\''+s.id+'\')" style="padding:6px 10px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:11px">'+(s.present?'✅ YAJE':'❌ NTARAZA')+'</button> '+(admin?'<button onclick="wa(\''+s.id+'\')" style="padding:6px 10px;border-radius:999px;background:#25D366;color:#fff;border:none;font-size:11px">📱 WhatsApp</button>':'')+'</div></div>';}document.getElementById('teamList').innerHTML=h||'<div class="box">Nta bakozi muri shift yawe</div>';}
function tog(id){if(!isAdmin()&&getMe()&&getMe().id!==id){alert('NTEMEREWE - Ushobora kwemeza wewe gusa!');return}for(var i=0;i<staff.length;i++)if(staff[i].id===id)staff[i].present=!staff[i].present;save();renderTeam();renderProd();}
function wa(id){var s=staff.find(function(x){return x.id===id});if(!s)return;var wp=s.phone.replace(/[^0-9]/g,'');if(wp.startsWith('0'))wp='25'+wp;if(wp.length===10)wp='25'+wp;var m=encodeURIComponent("Muraho "+s.name+"! 👋\nIZIHIRWE:\n🆔 ID: "+s.id+"\n🔑 PIN: "+s.pin+"\n💰 "+s.salary.toLocaleString()+" RWF\n⏰ "+s.shift+"\n\n🌐 https://didier123-4.github.io/izihirwe-pro-system/");window.open("https://wa.me/"+wp+"?text="+m,'_blank');}
function renderTime(){var admin=isAdmin();var me=getMe();document.getElementById('myInfo').textContent=me?me.id+' - '+me.name+' - '+me.shift+' | '+getLM():'ADMIN '+auth+' - '+getLM()+' | Bose';document.getElementById('timeId').value=admin?'':auth;var list=admin?logs:logs.filter(function(l){return l.id===auth});var h='<div class="box"><table><tr><th>ID</th><th>Type</th><th>Time</th></tr>';for(var i=list.length-1;i>=0&&i>list.length-20;i--)h+='<tr><td>'+list[i].id+'</td><td>'+list[i].type+'</td><td>'+list[i].time+'</td></tr>';h+='</table></div>';document.getElementById('timeLog').innerHTML=h;}
function tIn(){var id=(document.getElementById('timeId').value.trim().toUpperCase()||auth);if(isAdmin()&&admins.find(function(x){return x.user===id}))return;var s=staff.find(function(x){return x.id===id});if(!s)return;if(!isAdmin()&&s.id!==auth){alert('NTEMEREWE - IN yawe gusa!');return}s.present=true;logs.push({id:id,name:s.name,type:'IN',time:new Date().toLocaleString()});save();renderAll();}
function tOut(){var id=(document.getElementById('timeId').value.trim().toUpperCase()||auth);if(!isAdmin()&&id!==auth){alert('NTEMEREWE - OUT yawe gusa!');return}logs.push({id:id,type:'OUT',time:new Date().toLocaleString()});save();renderTime();}
function renderProd(){var admin=isAdmin();var me=getMe();var list=admin?staff:(me?staff.filter(function(s){return s.shift===me.shift}):[]);document.getElementById('prodInfo').textContent=admin?'Production yose - Bose '+staff.length+' - OK | '+getLM():'Production ya shift yawe ('+(me?me.shift:'')+'): '+list.length+' gusa - ATEMEREWE ABANDI | '+getLM();var h='<div class="grid">';for(var i=0;i<list.length;i++)h+='<div class="team-card"><b>'+list[i].id+' - '+list[i].name+'</b><br><span style="font-size:11px">'+list[i].shift+' - '+(list[i].present?'✅ Yaje':'❌ Ntariho')+'</span></div>';h+='</div>';document.getElementById('prodList').innerHTML=h;}
function renderAv(){var admin=isAdmin();var f=document.getElementById('avForm');if(admin)f.innerHTML='<p style="font-size:11px;color:#94a3b8">ADMIN '+auth+' - Emeza Avance za '+getLM()+' - Bose</p>';else f.innerHTML='<p style="font-size:11px;color:#f59e0b">NTEMEREWE Kureba Avance zabandi - Izawe gusa</p>';var list=admin?avs:[];var h='';for(var i=list.length-1;i>=0;i--){var a=list[i];h+='<div style="background:#1e293b;border:1px solid #f59e0b;border-radius:10px;padding:8px;margin-bottom:6px;font-size:12px"><b>'+a.id+' - '+a.name+'</b> '+a.amount.toLocaleString()+' - '+a.reason+' - '+a.status+(a.status==='PENDING'?'<br><button onclick="appAv(\''+a.uid+'\')" style="background:#22c55e;color:#fff;border:none;padding:5px 10px;border-radius:999px;margin-top:4px">✅ Emeza</button> <button onclick="rejAv(\''+a.uid+'\')" style="background:#ef4444;color:#fff;border:none;padding:5px 10px;border-radius:999px">❌</button>':'')+'</div>';}document.getElementById('avList').innerHTML=h||(admin?'Nta Avance':'NTEMEREWE - Reba muri SETTINGS');}
function renderEmpAv(){var me=getMe();if(!me)return;document.getElementById('empAvForm').innerHTML='<p style="font-size:11px">Salary yawe: '+me.salary.toLocaleString()+' | '+getLM()+'</p><input id="avAmt" type="number" placeholder="20000"><input id="avRs" placeholder="Impamvu"><button class="btn" style="background:#f59e0b" onclick="reqAv()">💸 Saba Avance</button>';var list=avs.filter(function(a){return a.id===auth});var h='';for(var i=list.length-1;i>=0;i--)h+='<div style="background:#1e293b;border:1px solid #f59e0b;border-radius:10px;padding:8px;margin-bottom:6px;font-size:12px">'+list[i].amount.toLocaleString()+' - '+list[i].reason+' - '+list[i].status+'</div>';document.getElementById('empAvList').innerHTML=h||'Nta Avance yawe';}
function reqAv(){var am=parseInt(document.getElementById('avAmt').value||0);var rs=document.getElementById('avRs').value||'Avance';if(!am)return;var me=getMe();if(!me)return;avs.push({uid:'AV'+Date.now(),id:me.id,name:me.name,amount:am,reason:rs,status:'PENDING'});save();renderAll();}
function appAv(uid){if(!isAdmin()){alert('NTEMEREWE - ADMIN gusa!');return}for(var i=0;i<avs.length;i++)if(avs[i].uid===uid)avs[i].status='APPROVED';save();renderAll();}
function rejAv(uid){if(!isAdmin()){alert('NTEMEREWE!');return}for(var i=0;i<avs.length;i++)if(avs[i].uid===uid)avs[i].status='REJECTED';save();renderAll();}
function renderPay(){var admin=isAdmin();var me=getMe();var list=admin?staff:(me?[me]:[]);var totS=0,totA=0;for(var i=0;i<list.length;i++){totS+=list[i].salary;for(var j=0;j<avs.length;j++)if(avs[j].id===list[i].id&&avs[j].status==='APPROVED')totA+=avs[j].amount}document.getElementById('paySum').innerHTML=(admin?'📅 Bose | ':'📅 We gusa | ')+'<b>'+getLM()+'</b> (AUTO)<br>Salary: '+totS.toLocaleString()+' | Avance: <span style="color:#f59e0b">-'+totA.toLocaleString()+'</span> | Net: <span style="color:#22c55e;font-size:16px;font-weight:900">'+(totS-totA).toLocaleString()+' RWF</span>'+(admin?'':'<br><span style="font-size:10px;color:#f59e0b">NTEMEREWE Kureba abandi!</span>');var h='<div class="box"><table><tr><th>ID</th><th>Izina</th><th>Shift</th><th>Salary</th><th>Avance</th><th>FINAL '+getLM()+'</th></tr>';for(var i=0;i<list.length;i++){var s=list[i];var av=0;for(var j=0;j<avs.length;j++)if(avs[j].id===s.id&&avs[j].status==='APPROVED')av+=avs[j].amount;h+='<tr><td>'+s.id+'</td><td>'+s.name+'</td><td>'+s.shift+'</td><td>'+s.salary.toLocaleString()+'</td><td style="color:#f59e0b">-'+av.toLocaleString()+'</td><td style="color:#22c55e"><b>'+(s.salary-av).toLocaleString()+'</b></td></tr>';}if(admin)h+='<tr style="background:#0f172a;font-weight:900"><td colspan="3">TOTAL '+getLM()+'</td><td>'+totS.toLocaleString()+'</td><td>-'+totA.toLocaleString()+'</td><td>'+(totS-totA).toLocaleString()+'</td></tr>';h+='</table></div>';document.getElementById('payTable').innerHTML=h;}
function renderAdmins(){var h='<table><tr><th>Username</th><th>Izina</th><th>PIN</th><th>Action</th></tr>';for(var i=0;i<admins.length;i++)h+='<tr><td><b>'+admins[i].user+'</b></td><td>'+admins[i].name+'</td><td>'+admins[i].pin+'</td><td>'+(admins[i].user!=='ADMIN'?'<button onclick="delAdmin(\''+admins[i].user+'\')" style="background:#ef4444;color:#fff;border:none;padding:4px 8px;border-radius:999px;font-size:10px">Siba</button>':'MAIN')+'</td></tr>';h+='</table>';document.getElementById('aList').innerHTML=h;}
function addAdmin(){if(!isAdmin()){alert('NTEMEREWE - ADMIN gusa!');return}var n=document.getElementById('aN').value.trim();var u=document.getElementById('aU').value.trim().toUpperCase();var ph=document.getElementById('aPh').value.trim();var pi=document.getElementById('aPi').value.trim();if(!n||!u||!pi){alert('Izina+Username+PIN!');return}for(var i=0;i<admins.length;i++)if(admins[i].user.toUpperCase()===u){alert('Username arahari!');return}admins.push({user:u,name:n,phone:ph,pin:pi});save();renderAdmins();document.getElementById('aN').value='';document.getElementById('aU').value='';document.getElementById('aPh').value='';document.getElementById('aPi').value='';alert('✅ ADMIN '+u+' Yongerewe! ID:'+u+' PIN:'+pi);}
function delAdmin(u){if(!isAdmin())return;if(u==='ADMIN')return;if(confirm('Siba '+u+'?')){var na=[];for(var i=0;i<admins.length;i++)if(admins[i].user!==u)na.push(admins[i]);admins=na;save();renderAdmins();}}
function addStaff(){if(!isAdmin()){alert('NTEMEREWE - ADMIN gusa!');return}var n=document.getElementById('nN').value.trim();var ph=document.getElementById('nPh').value.trim();var pi=document.getElementById('nPi').value.trim();var sa=parseInt(document.getElementById('nSa').value)||100000;var sh=document.getElementById('nSh').value;if(!n||!pi){alert('Amazina+PIN!');return}var id='IZP-'+String(staff.length+1).padStart(3,'0');staff.push({id:id,name:n,phone:ph,pin:pi,salary:sa,shift:sh,present:false});save();renderAll();var wp=ph.replace(/[^0-9]/g,'');if(wp.startsWith('0'))wp='25'+wp;if(wp.length===10)wp='25'+wp;var msg=encodeURIComponent("Muraho "+n+"! 👋\nIZIHIRWE 🇷🇼\n🆔 ID: "+id+"\n🔑 PIN: "+pi+"\n💰 Salary: "+sa.toLocaleString()+"\n⏰ Shift: "+sh+"\n\n🌐 https://didier123-4.github.io/izihirwe-pro-system/");if(confirm('✅ '+n+' '+id+' Yanditswe! WhatsApp?'))window.open("https://wa.me/"+wp+"?text="+msg,'_blank');}
function logout(){try{localStorage.removeItem('iz_auth8');}catch(e){}location.reload();}
function resetAll(
