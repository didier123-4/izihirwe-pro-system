<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAPPY V7.13.3 LINKED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#e2e8f0}
.card{background:#1e293b;border:1px solid #334155;padding:26px;border-radius:22px;width:90%;max-width:420px;text-align:center;margin:20px auto}
input,select{width:100%;padding:13px;border-radius:11px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:8px}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;cursor:pointer}
.btn-del{padding:6px 10px;border-radius:8px;border:none;background:#ef4444;color:#fff;font-weight:800;font-size:11px}
.header{padding:10px 14px;display:flex;justify-content:space-between;border-bottom:1px solid #1e293b}
.nav{display:flex;gap:6px;overflow:auto;padding:10px 12px;background:#0f172a;position:sticky;top:0;z-index:9}
.nav button{padding:11px 18px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-weight:800;font-size:13px;white-space:nowrap}
.nav button.active{background:#38bdf8!important;color:#0f172a!important}
.content{padding:12px;max-width:1250px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.box{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;margin-bottom:10px}
.profile{border:2px solid #38bdf8;background:linear-gradient(135deg,#1e293b,#0f172a);padding:16px}
</style>
</head>
<body>

<div id="L" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px">
<div class="card">
<h2>V7.13.3 LINKED 🔗</h2>
<p style="color:#22c55e;font-size:11px;margin:6px 0 14px">✅ Login 100% + Data IHUZA - TIME+AVANCE+PAYROLL</p>
<input id="u" placeholder="ADMIN cyangwa IZP-001 cyangwa 078...">
<input id="p" type="password" value="1234" placeholder="PIN">
<button id="btnE" class="btn" style="background:#38bdf8;color:#0f172a;margin-bottom:10px">ENTRANCE - LINKED</button>
<button id="btnF" class="btn" style="background:#22c55e;color:#fff">🔓 FORCE ENTER - 100% IKORA</button>
<p id="loginHelp" style="font-size:10px;color:#f59e0b;margin-top:10px;text-align:left;background:#0f172a;padding:8px;border-radius:8px">💡 Umukozi yinjira:<br>• ID: IZP-002 (MAJUSCULE auto)<br>• Cyangwa Phone: 078...<br>• PIN: 1002<br><br>Login ntiyanga - V7.13.3 auto fix!</p>
</div>
</div>

<div id="A" style="display:none">
<div class="header"><div><b>V7.13.3</b> <span id="badge" style="background:#38bdf8;color:#0f172a;padding:3px 8px;border-radius:999px;font-size:10px">ADMIN</span> <span id="mHead" style="font-size:11px;color:#22c55e"></span></div><button onclick="location.reload()" style="padding:7px 14px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#fff">Logout</button></div>
<div class="nav"><button class="active" id="nav_team">👥 TEAM</button><button id="nav_time">⏰ TIME</button><button id="nav_pay">💰 PAYROLL</button><button id="nav_av">💸 AVANCE</button><button id="nav_set">⚙️ SETTINGS</button></div>
<div class="content">
<div id="teamTab"><div id="teamList" class="grid"></div></div>
<div id="timeTab" style="display:none"><div id="linkedProfile"></div><div class="box" style="border:2px solid #22c55e;text-align:center"><h3>⏰ TIME</h3><div id="clock" style="font-size:32px;font-weight:900">--:--:--</div><div id="myInfo"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><button class="btn" style="background:#22c55e;padding:18px" id="btnIn">✅ YAJE</button><button class="btn" style="background:#ef4444;padding:18px" id="btnOut">🔴 NASOJE</button></div></div><div id="timeLog"></div></div>
<div id="payTab" style="display:none"><div id="payTable"></div></div>
<div id="avTab" style="display:none"><div id="adminAvList"></div></div>
<div id="setTab" style="display:none">
<div class="box" style="border:2px solid #38bdf8"><h3>👑 Kongeramo ADMIN</h3><input id="aN" placeholder="Amazina"><input id="aU" placeholder="Username"><input id="aPh" placeholder="Phone"><input id="aPi" placeholder="PIN" type="number"><button class="btn" style="background:#38bdf8;color:#0f172a" id="btnAddAdmin">Ongeramo ADMIN</button><div id="aList"></div></div>
<div class="box" style="border:2px solid #22c55e"><h3>👥 Andikisha - Auto LINKED 🔗</h3><input id="nN" placeholder="Amazina"><input id="nPh" placeholder="Phone 078..."><input id="nPi" placeholder="PIN 1001" type="number"><input id="nSa" placeholder="Salary 100000" type="number"><select id="nSh"><option value="Day">☀️ Day</option><option value="Night">🌙 Night</option></select><label style="display:flex;align-items:center;gap:8px;margin:8px 0;color:#f59e0b"><input type="checkbox" id="nSun" style="width:auto"> ⛪ Akora Ku Cyumweru?</label><button class="btn" style="background:#22c55e;color:#fff" id="btnAddStaff">Andikisha - LINK TIME+AVANCE+PAYROLL 🔗</button></div>
</div>
</div>
</div>

<script>
var defaultStaff=[
{id:'IZP-001',name:'Alice',phone:'0788100001',pin:'1001',salary:120000,shift:'Night',present:false,sunday:true},
{id:'IZP-002',name:'Bob',phone:'0788100002',pin:'1002',salary:100000,shift:'Day',present:false,sunday:false},
{id:'IZP-003',name:'Claire',phone:'0788100003',pin:'1003',salary:100000,shift:'Day',present:false,sunday:true},
{id:'IZP-004',name:'David',pin:'1004',salary:110000,shift:'Night',present:false,sunday:false},
{id:'IZP-005',name:'Emmanuel',pin:'1005',salary:100000,shift:'Day',present:false,sunday:false},
{id:'IZP-006',name:'Faith',pin:'1006',salary:100000,shift:'Day',present:false,sunday:true},
{id:'IZP-007',name:'Grace',pin:'1007',salary:100000,shift:'Day',present:false,sunday:false},
{id:'IZP-008',name:'Henry',pin:'1008',salary:100000,shift:'Night',present:false,sunday:true},
{id:'IZP-009',name:'Irene',pin:'1009',salary:100000,shift:'Day',present:false,sunday:false},
{id:'IZP-010',name:'Jean',pin:'1010',salary:100000,shift:'Day',present:false,sunday:false}
];
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}
var staff=load('iz_staff',defaultStaff);
var admins=load('iz_admins',[{user:'ADMIN',pin:'1234',name:'Main'}]);
var avances=load('iz_avances',[]);
var timelogs=load('iz_logs',[]);
var curUser=null;
function saveAll(){save('iz_staff',staff);save('iz_admins',admins);save('iz_avances',avances);save('iz_logs',timelogs);}
function getLM(){var d=new Date();d.setMonth(d.getMonth()-1);var m=['Mutarama','Gashyantare','Werurwe','Mata','Gicurasi','Kamena','Nyakanga','Kanama','Nzeri','Ukwakira','Ugushyingo','Ukuboza'];return m[d.getMonth()]+' '+d.getFullYear();}
function findUser(inp){
var u=inp.trim().toUpperCase();
var uPhone=inp.trim().replace(/[^0-9]/g,'');
var found=null;
// ADMIN
for(var i=0;i<admins.length;i++)if(admins[i].user===u)found={type:'admin',data:admins[i],id:u};
if(!found)for(var i=0;i<staff.length;i++){
if(staff[i].id===u||staff[i].phone.replace(/[^0-9]/g,'')===uPhone||staff[i].phone===inp.trim()){found={type:'staff',data:staff[i],id:staff[i].id};break;}
}
return found;
}
function openApp(){
var uRaw=document.getElementById('u').value.trim();var p=document.getElementById('p').value.trim();
if(!uRaw){alert('Andika ID cyangwa Phone');return;}
var f=findUser(uRaw);
if(!f){alert('❌ Ntago abonetse: '+uRaw+' - Reba ID IZP-001 cyangwa Phone 078...');return;}
if(f.data.pin!==p&&!(f.type==='admin'&&uRaw.toUpperCase()==='ADMIN'&&p==='1234')){alert('❌ PIN ntabwo ariyo - PIN ni: '+f.data.pin);return;}
curUser=f;
document.getElementById('L').style.display='none';document.getElementById('A').style.display='block';
document.getElementById('mHead').textContent=getLM()+' - '+f.data.name+' ('+f.id+') - LINKED 🔗';
document.getElementById('badge').textContent=f.id;
renderAll();
}
function getAv(id){var t=0;for(var i=0;i<avances.length;i++)if(avances[i].empId===id&&avances[i].status==='APPROVED')t+=avances[i].amount;return t;}
function getHours(id){var h=0;for(var i=0;i<timelogs.length;i++)if(timelogs[i].empId===id)h+=timelogs[i].hours||0;return Math.round(h*10)/10;}
function renderTeam(){
var h='';for(var i=0;i<staff.length;i++){
var av=getAv(staff[i].id);var hrs=getHours(staff[i].id);var finalSal=staff[i].salary-av;
h+='<div class="box profile"><b>'+staff[i].id+' - '+staff[i].name+'</b> '+(staff[i].sunday?'⛪':'')+'<br>📱 '+staff[i].phone+' | PIN:'+staff[i].pin+'<br>Shift:'+staff[i].shift+' '+(staff[i].present?'✅':'❌')+'<br><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0;font-size:11px"><div style="background:#0f172a;padding:6px;border-radius:8px">💰 Salary<br><b>'+staff[i].salary.toLocaleString()+'</b></div><div style="background:#0f172a;padding:6px;border-radius:8px">💸 Avance<br><b style="color:#f59e0b">'+av.toLocaleString()+'</b></div><div style="background:#0f172a;padding:6px;border-radius:8px">⏰ Hours<br><b style="color:#22c55e">'+hrs+'h</b></div><div style="background:#38bdf8;color:#0f172a;padding:6px;border-radius:8px">💵 FINAL<br><b>'+finalSal.toLocaleString()+'</b></div></div>🔗 LINKED: TIME('+hrs+'h) + AVANCE('+av.toLocaleString()+') + SALARY('+staff[i].salary.toLocaleString()+') = PAYROLL('+finalSal.toLocaleString()+')<br><div style="display:flex;gap:6px;margin-top:8px"><button class="btn-del" onclick="deleteStaff(\''+staff[i].id+'\')">🗑️ SIBA</button><button style="padding:6px 10px;border-radius:8px;background:#38bdf8;border:none;font-weight:800;font-size:11px" onclick="viewLinked(\''+staff[i].id+'\')">🔗 REBA DATA</button></div></div>';
}
document.getElementById('teamList').innerHTML=h;
}
function renderLinkedProfile(){
if(!curUser)return;
if(curUser.type==='admin'){
document.getElementById('linkedProfile').innerHTML='<div class="box" style="background:#38bdf8;color:#0f172a">👑 ADMIN - Ubona data ya bose - LINKED</div>';
return;
}
var s=curUser.data;var av=getAv(s.id);var hrs=getHours(s.id);var finalSal=s.salary-av;
var h='<div class="box profile" style="border:3px solid #22c55e"><h3>👤 '+s.id+' - '+s.name+' - DATA IHUZA 🔗</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0"><div style="background:#0f172a;padding:10px;border-radius:10px">💰 Umushahara<br><b style="font-size:18px">'+s.salary.toLocaleString()+' RWF</b></div><div style="background:#0f172a;padding:10px;border-radius:10px">💸 Avance Yemejwe<br><b style="font-size:18px;color:#f59e0b">'+av.toLocaleString()+'</b></div><div style="background:#0f172a;padding:10px;border-radius:10px">⏰ Amasaha Yakoze<br><b style="font-size:18px;color:#22c55e">'+hrs+'h</b> ('+getLM()+')</div><div style="background:#38bdf8;color:#0f172a;padding:10px;border-radius:10px">💵 PAYROLL FINAL<br><b style="font-size:18px">'+finalSal.toLocaleString()+' RWF</b><br><small>Salary - Avance</small></div></div><div style="font-size:11px;color:#94a3b8">🔗 Agora: Salary('+s.salary.toLocaleString()+') - Avance('+av.toLocaleString()+') = Payroll('+finalSal.toLocaleString()+') | Time: '+hrs+'h | Shift:'+s.shift+' '+(s.sunday?'⛪ Cyumweru':'')+'</div></div>';
document.getElementById('linkedProfile').innerHTML=h;
document.getElementById('myInfo').textContent=s.id+' - '+s.name+' - '+getLM()+' - FINAL:'+finalSal.toLocaleString()+' RWF';
}
function renderAll(){renderTeam();renderLinkedProfile();renderTimeLogs();renderPay();renderAv();renderAdmins();}
function renderTimeLogs(){
var h='<div class="box"><table><tr><th>Date</th><th>ID</th><th>IN</th><th>OUT</th><th>H</th></tr>';for(var i=timelogs.length-1;i>=0;i--){var l=timelogs[i];if(curUser&&curUser.type==='staff'&&l.empId!==curUser.id)continue;h+='<tr><td>'+l.date+'</td><td>'+l.empId+'</td><td>'+l.timeIn+'</td><td>'+(l.timeOut||'-')+'</td><td>'+(l.hours||'-')+'</td></tr>';}h+='</table></div>';document.getElementById('timeLog').innerHTML=h;
}
function renderPay(){
var h='<div class="box"><table><tr><th>ID</th><th>Izina</th><th>Salary</th><th>Avance</th><th>Hours</th><th>FINAL</th><th>🗑️</th></tr>';for(var i=0;i<staff.length;i++){if(curUser&&curUser.type==='staff'&&staff[i].id!==curUser.id)continue;var av=getAv(staff[i].id);var hrs=getHours(staff[i].id);h+='<tr><td>'+staff[i].id+'</td><td>'+staff[i].name+'</td><td>'+staff[i].salary.toLocaleString()+'</td><td>'+av.toLocaleString()+'</td><td>'+hrs+'h</td><td><b>'+(staff[i].salary-av).toLocaleString()+'</b></td><td><button class="btn-del" onclick="deleteStaff(\''+staff[i].id+'\')">SIBA</button></td></tr>';}h+='</table></div>';document.getElementById('payTable').innerHTML=h;
}
function renderAv(){var h='';for(var i=0;i<avances.length;i++){if(curUser&&curUser.type==='staff'&&avances[i].empId!==curUser.id)continue;var st=avances[i].status;h+='<div class="box">'+avances[i].empId+' '+avances[i].empName+' - '+avances[i].amount.toLocaleString()+' - '+st+' '+(st==='PENDING'&&curUser&&curUser.type==='admin'?'<br><button class="btn" style="background:#22c55e;padding:8px;margin-top:6px" onclick="approveAv(\''+avances[i].id+'\')">EMEZA</button>':'')+'</div>';}document.getElementById('adminAvList').innerHTML=h||'Nta avance';}
function renderAdmins(){var h='<table><tr><th>User</th><th>Izina</th><th>PIN</th><th>🗑️</th></tr>';for(var i=0;i<admins.length;i++)h+='<tr><td>'+admins[i].user+'</td><td>'+admins[i].name+'</td><td>'+admins[i].pin+'</td><td>'+(admins[i].user!=='ADMIN'?'<button class="btn-del" onclick="deleteAdmin(\''+admins[i].user+'\')">SIBA</button>':'🔒')+'</td></tr>';h+='</table>';document.getElementById('aList').innerHTML=h;}
window.viewLinked=function(id){openTab('time',document.getElementById('nav_time'));var f=findUser(id);if(f){curUser=f;document.getElementById('badge').textContent=id;renderAll();}};
window.deleteStaff=function(id){if(!confirm('Siba '+id+'? Data ye yose TIME+AVANCE+PAYROLL izasibama!'))return;staff=staff.filter(function(x){return x.id!==id;});avances=avances.filter(function(a){return a.empId!==id;});timelogs=timelogs.filter(function(l){return l.empId!==id;});saveAll();renderAll();};
window.deleteAdmin=function(u){if(u==='ADMIN')return;if(!confirm('Siba ADMIN '+u+'?'))return;admins=admins.filter(function(a){return a.user!==u;});saveAll();renderAdmins();};
window.approveAv=function(id){for(var i=0;i<avances.length;i++)if(avances[i].id===id)avances[i].status='APPROVED';saveAll();renderAll();};
function setup(){
function go(){openApp();setInterval(function(){var c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleTimeString();},1000);}
document.getElementById('btnE').addEventListener('click',go);document.getElementById('btnF').addEventListener('click',go);
document.getElementById('btnE').addEventListener('touchend',go);document.getElementById('btnF').addEventListener('touchend',go);
document.getElementById('nav_team').addEventListener('click',function(){openTab('team',this);});
document.getElementById('nav_time').addEventListener('click',function(){openTab('time',this);});
document.getElementById('nav_pay').addEventListener('click',function(){openTab('pay',this);});
document.getElementById('nav_av').addEventListener('click',function(){openTab('av',this);});
document.getElementById('nav_set').addEventListener('click',function(){openTab('set',this);});
document.getElementById('btnIn').addEventListener('click',function(){tIn();});document.getElementById('btnOut').addEventListener('click',function(){tOut();});
document.getElementById('btnAddAdmin').addEventListener('click',addAdmin);document.getElementById('btnAddStaff').addEventListener('click',addStaff);
}
function openTab(n,b){var bs=document.querySelectorAll('.nav button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('active');b.classList.add('active');var ts=['team','time','pay','av','set'];for(var i=0;i<ts.length;i++)document.getElementById(ts[i]+'Tab').style.display=ts[i]===n?'block':'none';}
function tIn(){var id=curUser?curUser.id:'IZP-001';var emp=staff.find(function(s){return s.id===id;});if(!emp)emp={id:id,name:id};var now=new Date();var date=now.toISOString().slice(0,10);var time=now.toTimeString().slice(0,5);for(var i=0;i<timelogs.length;i++)if(timelogs[i].empId===id&&timelogs[i].date===date&&timelogs[i].timeOut===''){alert('Warinjiye');return;}timelogs.push({empId:id,empName:emp.name,date:date,timeIn:time,timeOut:'',hours:0});for(var i=0;i<staff.length;i++)if(staff[i].id===id)staff[i].present=true;saveAll();renderAll();}
function tOut(){var id=curUser?curUser.id:'IZP-001';var now=new Date();var date=now.toISOString().slice(0,10);var time=now.toTimeString().slice(0,5);var f=null;for(var i=timelogs.length-1;i>=0;i--)if(timelogs[i].empId===id&&timelogs[i].date===date&&timelogs[i].timeOut===''){f=timelogs[i];break;}if(!f){alert('Ntiwinjiye');return;}var inH=parseInt(f.timeIn.split(':')[0]);var outH=parseInt(time.split(':')[0]);var h=outH-inH;if(h<0)h+=24;f.timeOut=time;f.hours=h;for(var i=0;i<staff.length;i++)if(staff[i].id===id)staff[i].present=false;saveAll();renderAll();}
function addAdmin(){var n=document.getElementById('aN').value;var u=document.getElementById('aU').value.trim().toUpperCase();var ph=document.getElementById('aPh').value;var pi=document.getElementById('aPi').value;if(!n||!u||!pi){alert('Uzuza');return;}admins.push({user:u,name:n,phone:ph,pin:pi});saveAll();renderAdmins();alert('ADMIN '+n+' Wongerewemo');}
function addStaff(){
var n=document.getElementById('nN').value;var ph=document.getElementById('nPh').value;var pi=document.getElementById('nPi').value;var sa=parseInt(document.getElementById('nSa').value)||100000;var sh=document.getElementById('nSh').value;var sun=document.getElementById('nSun').checked;
if(!n||!ph||!pi){alert('Uzuza Amazina+Phone+PIN');return;}
var id='IZP-'+String(staff.length+1).padStart(3,'0');
var newEmp={id:id,name:n,phone:ph,pin:pi,salary:sa,shift:sh,present:false,sunday:sun};
staff.push(newEmp);saveAll();renderAll();
var p=ph.replace(/[^0-9]/g,'');if(p.startsWith('0'))p='250'+p.slice(1);
var msg='Murakaza neza '+n+'!%0aID:'+id+'%0aPIN:'+pi+'%0aPhone:'+ph+'%0aSalary:'+sa.toLocaleString()+'%0aShift:'+sh+'%0a🔗 Data yawe ihuza TIME+AVANCE+PAYROLL%0aLink:https://didier123-4.github.io/izihirwe-pro-system/';
window.open('https://wa.me/'+p+'?text='+msg,'_blank');
alert('✅ '+n+' '+id+' Yanditswe - DATA LINKED 🔗\\nSalary:'+sa.toLocaleString()+' | Avance:0 | Hours:0h | FINAL:'+sa.toLocaleString()+'\\nUmukozi yinjira na ID:'+id+' cyangwa Phone:'+ph+' + PIN:'+pi);
}
document.addEventListener('DOMContentLoaded',setup);
</script>
</body>
</html>
