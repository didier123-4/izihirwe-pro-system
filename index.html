<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>IZIHIRWE Pro</title><link rel="manifest" href="manifest.json"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:white;min-height:100vh}.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#1e293b;padding:35px;border-radius:20px;width:100%;max-width:400px;border:1px solid #334155}input{width:100%;padding:14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white;margin-bottom:12px;font-size:16px}button{width:100%;padding:14px;background:#38bdf8;color:#0f172a;border:none;border-radius:10px;font-weight:700;cursor:pointer}.error{color:#f87171;text-align:center;margin-top:12px;display:none}#app{display:none;padding:15px}</style></head><body>
<div id="loginPage" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div style="background:#1e293b;padding:35px;border-radius:20px;max-width:400px;width:100%"><h1 style="text-align:center">IZIHIRWE Pro</h1><p style="text-align:center;color:#94a3b8;margin-bottom:20px">30 Staff • Day/Night • Sunday OFF</p><input id="userId" placeholder="ID" value="ADMIN"><input id="pin" type="password" placeholder="PIN" value="1234"><button onclick="login()">INJIRA / LOGIN</button><div id="err" style="color:#f87171;text-align:center;margin-top:12px;display:none">ID cyangwa PIN siyo! Koresha ADMIN / 1234</div></div></div>
<div id="app"><div style="display:flex;justify-content:space-between;background:#1e293b;padding:12px;border-radius:12px;margin-bottom:15px"><b>IZIHIRWE Pro • 30 Staff</b><button style="width:auto;padding:8px 14px;background:#334155;color:white" onclick="localStorage.clear();location.reload()">Logout</button></div><div id="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px"></div></div>
<script>
const NAMES=["Alice","Bob","Claire","David","Emmanuel","Faith","Grace","Henry","Irene","Jean","Kevin","Linda","Moses","Nadia","Oscar","Paul","Queen","Robert","Sarah","Thomas","Ursula","Victor","Wendy","Xavier","Yvonne","Zack","Aline","Brian","Diane","Eric"];
let data=JSON.parse(localStorage.getItem('staff')||'null')||NAMES.map((n,i)=>({id:i+1,name:n,shift:i%2==0?'Day':'Night'}));
function login(){let u=document.getElementById('userId').value.trim().toUpperCase(),p=document.getElementById('pin').value.trim();if(u==='ADMIN'&&p==='1234'){localStorage.setItem('logged','1');showApp()}else{document.getElementById('err').style.display='block'}}
function showApp(){document.getElementById('loginPage').style.display='none';document.getElementById('app').style.display='block';render()}
function render(){let h='';data.forEach(s=>{h+=`<div style="background:#1e293b;padding:14px;border-radius:12px;border-left:4px solid #38bdf8"><b>${s.id}. ${s.name}</b> - ${s.shift} <select onchange="data[${s.id-1}].shift=this.value;localStorage.setItem('staff',JSON.stringify(data));render()" style="float:right;background:#0f172a;color:white;padding:4px"><option ${s.shift=='Day'?'selected':''}>Day</option><option ${s.shift=='Night'?'selected':''}>Night</option></select></div>`});document.getElementById('list').innerHTML=h}
if(localStorage.getItem('logged')==='1')showApp();
</script></body></html>
