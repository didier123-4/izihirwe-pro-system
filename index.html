<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAPPY V7.9.0 FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#e2e8f0;min-height:100vh}
.card{background:#1e293b;border:1px solid #334155;padding:26px;border-radius:22px;width:90%;max-width:420px;text-align:center}
input,select{width:100%;padding:13px;border-radius:11px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:8px}
.btn{width:100%;padding:13px;border:none;border-radius:11px;font-weight:900;cursor:pointer}
.header{padding:10px 14px;display:flex;justify-content:space-between;border-bottom:1px solid #1e293b}
.nav{display:flex;gap:6px;overflow:auto;padding:10px 12px;background:#0f172a;position:sticky;top:52px;z-index:9}
.nav button{padding:10px 16px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-weight:800;font-size:12px}
.nav button.active{background:#38bdf8!important;color:#0f172a!important}
.content{padding:12px;max-width:1250px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.box{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #334155;font-size:11px}
th{background:#0f172a}
</style>
</head>
<body>

<div id="L" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px">
<div class="card">
<h2>HAPPY V7.9.0</h2>
<p style="color:#22c55e;font-size:11px;margin:6px 0 14px">✅ FIXED - Kanda FORCE ifunguka 100%</p>
<input id="u" value="ADMIN">
<input id="p" type="password" value="1234">
<button class="btn" style="background:#38bdf8;color:#0f172a;margin-bottom:8px" onclick="go()">ENTRANCE</button>
<button class="btn" style="background:#22c55e;color:#fff" onclick="go()">🔓 FORCE ENTER</button>
<p style="font-size:10px;color:#64748b;margin-top:8px">ADMIN/1234 | IZP-001/1001</p>
</div>
</div>

<div id="A" style="display:none">
<div class="header">
<div><b>V7.9.0</b> <span id="badge" style="background:#38bdf8;color:#0f172a;padding:3px 8px;border-radius:999px;font-size:10px"></span></div>
<button onclick="location.reload()" style="padding:7px 14px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#fff">Logout</button>
</div>

<div class="nav">
<button class="active" onclick="openTab('team',this)">👥 TEAM</button>
<button onclick="openTab('time',this)">⏰ TIME IN/OUT</button>
<button onclick="openTab('pay',this)">💰 PAYROLL</button>
<button onclick="openTab('av',this)">💸 AVANCE</button>
<button onclick="openTab('set',this)">⚙️ SETTINGS</button>
</div>

<div class="content">
<div id="teamTab">
<div style="color:#94a3b8;font-size:12px;margin-bottom:8px" id="teamInfo"></div>
<div id="teamList" class="grid"></div>
</div>

<div id="timeTab" style="display:none">
<div class="box" style="border:2px solid #22c55e;text-align:center">
<h3>⏰ TIME - Umukozi niwe winjira</h3>
<div id="clock" style="font-size:36px;font-weight:900;margin:10px 0">--:--:--</div>
<div id="myInfo"></div>
<div id="todayStatus" style="margin:12px 0"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<button class="btn" style="background:#22c55e;padding:18px" onclick="tIn()">✅ YAJE KUKAZI</button>
<button class="btn" style="background:#ef4444;padding:18px" onclick="tOut()">🔴 NASOJE SHIFT</button>
</div>
</div>
<div id="timeLog"></div>
</div>

<div id="payTab" style="display:none"><div class="box"><h3>💰 Payroll FINAL = Salary - Avance</h3><div id="paySum"></div></div><div id="payTable"></div></div>

<div id="avTab" style="display:none">
<div class="box"><div id="avStats"></div></div>
<div id="adminAvBox" class="box" style="border:2px solid #38bdf8"><h3>👑 Emeza/Anga</h3><div id="adminAvList"></div></div>
<div id="empAvBox" class="box" style="border:2px solid #f59e0b"><h3>Saba Avance</h3><input id="avAmt" type="number" placeholder="20000"><input id="avRs" placeholder="Impamvu"><button class="btn" style="background:#f59e0b" onclick="reqAv()">Saba</button><div id="myAvList"></div></div>
</div>

<div id="setTab" style="display:none">
<div class="box" style="border:2px solid #22c55e"><h3>Andikisha → WhatsApp AUTO</h3><input id="nN" placeholder="Amazina"><input id="nPh" placeholder="Phone 078..."><input id="nPi" placeholder="PIN" type="number"><input id="nSa" placeholder="Salary" type="number"><select id="nSh"><option value="Day">Day</option><option value="Night">Night</option></select><button class="btn" style="background:#22c55e" onclick="addStaff()">Andikisha → WhatsApp</button></div>
</div>
</div>
</div>

<script>
function go(){
var L=document.getElementById('L');
var A=document.getElementById('A');
L.style.display='none';
A.style.display='block';
document.getElementById('badge').textContent=document.getElementById('u').value.toUpperCase()||'ADMIN';
renderAll();
setInterval(function(){var n=new Date();var c=document.getElementById('clock');if(c)c.textContent=n.toLocaleTimeString();},1000);
}

var staff=[
{id:'IZP-001',name:'Alice',phone:'0788100001',pin:'1001',salary:120000,shift:'Night',present:false},
{id:'IZP-002',name:'Bob',pin:'1002',salary:100000,shift:'Day',present:false},
{id:'IZP-003',name:'Claire',pin:'1003',salary:100000,shift:'Day',present:false},
{id:'IZP-004',name:'David',pin:'1004',salary:110000,shift:'Night',present:false},
{id:'IZP-005',name:'Emmanuel',pin:'1005',salary:100000,shift:'Day',present:false}
];
var auth='ADMIN';
var timelogs=[];
var avances=[];

function renderAll(){renderTeam();renderTime();renderPay();renderAv();}
function getAv(id){var t=0;for(var i=0;i<avances.length;i++)if(avances[i].empId===id&&avances[i].status==='APPROVED')t+=avances[i].amount;return t;}
function renderTeam(){
var h='';
for(var i=0;i<staff.length;i++){
var av=getAv(staff[i].id);
h+='<div class="box"><b>'+staff[i].id+' '+staff[i].name+'</b><br>'+staff[i].shift+' '+(staff[i].present?'✅ Kukazi':'❌')+'<br>Sal:'+staff[i].salary+(av?' Av:'+av:'')+' Final:'+(staff[i].salary-av)+'</div>';
}
document.getElementById('teamList').innerHTML=h;
document.getElementById('teamInfo').textContent=staff.length+' Abakozi | Day/Night itandukanye';
}
function renderTime(){
var today=new Date().toISOString().slice(0,10);
var my=timelogs.filter(function(l){return l.date===today;});
var h='<div class="box"><table><tr><th>Date</th><th>ID</th><th>IN</th><th>OUT</th><th>Hours</th></tr>';
for(var i=timelogs.length-1;i>=0;i--){var l=timelogs[i];h+='<tr><td>'+l.date+'</td><td>'+l.empId+'</td><td style="color:#22c55e">'+l.timeIn+'</td><td style="color:#ef4444">'+(l.timeOut||'-')+'</td><td>'+(l.hours||'-')+'</td></tr>';}
h+='</table></div>';
document.getElementById('timeLog').innerHTML=h;
var u=document.getElementById('u').value.toUpperCase();
var me=null;for(var i=0;i<staff.length;i++)if(staff[i].id===u)me=staff[i];
if(me){document.getElementById('myInfo').textContent=me.name+' '+me.id+' Shift:'+me.shift;var t=timelogs.filter(function(l){return l.empId===me.id&&l.date===today;});if(t.length===0)document.getElementById('todayStatus').innerHTML='<span style="color:#f59e0b">❌ Ntiwinjiye - Kanda YAJE</span>';else{var lt=t[t.length-1];if(lt.timeOut==='')document.getElementById('todayStatus').innerHTML='<span style="color:#22c55e">✅ Winjiye:'+lt.timeIn+' Urakora</span>';else document.getElementById('todayStatus').innerHTML='<span style="color:#38bdf8">✅ Wasoje:'+lt.timeIn+'→'+lt.timeOut+'='+lt.hours+'h</span>';}}
}
function tIn(){
var u=document.getElementById('u').value.toUpperCase()||'IZP-001';
var empName=u;for(var i=0;i<staff.length;i++)if(staff[i].id===u)empName=staff[i].name;
var now=new Date();var date=now.toISOString().slice(0,10);var time=now.toTimeString().slice(0,5);
for(var i=0;i<timelogs.length;i++)if(timelogs[i].empId===u&&timelogs[i].date===date&&timelogs[i].timeOut===''){alert('Warinjiye '+timelogs[i].timeIn);return;}
timelogs.push({empId:u,empName:empName,date:date,timeIn:time,timeOut:'',hours:0});
for(var i=0;i<staff.length;i++)if(staff[i].id===u)staff[i].present=true;
renderAll();alert('✅ '+empName+' YAJE '+time);
}
function tOut(){
var u=document.getElementById('u').value.toUpperCase()||'IZP-001';
var empName=u;for(var i=0;i<staff.length;i++)if(staff[i].id===u)empName=staff[i].name;
var now=new Date();var date=now.toISOString().slice(0,10);var time=now.toTimeString().slice(0,5);
var found=null;for(var i=timelogs.length-1;i>=0;i--)if(timelogs[i].empId===u&&timelogs[i].date===date&&timelogs[i].timeOut===''){found=timelogs[i];break;}
if(!found){alert('Ntiwinjiye');return;}
var inH=parseInt(found.timeIn.split(':')[0]);var inM=parseInt(found.timeIn.split(':')[1]);var outH=parseInt(time.split(':')[0]);var outM=parseInt(time.split(':')[1]);var h=((outH*60+outM)-(inH*60+inM))/60;if(h<0)h+=24;h=Math.round(h*10)/10;
found.timeOut=time;found.hours=h;
for(var i=0;i<staff.length;i++)if(staff[i].id===u)staff[i].present=false;
renderAll();alert('🔴 '+empName+' NASOJE '+found.timeIn+'→'+time+'='+h+'h');
}
function renderPay(){
var tot=0;for(var i=0;i<staff.length;i++)tot+=(staff[i].salary-getAv(staff[i].id));
document.getElementById('paySum').textContent='FINAL Total: '+tot.toLocaleString()+' RWF = Salary - Avance';
var h='<div class="box"><table><tr><th>ID</th><th>Izina</th><th>Salary</th><th>Avance</th><th>FINAL</th></tr>';for(var i=0;i<staff.length;i++){var av=getAv(staff[i].id);h+='<tr><td>'+staff[i].id+'</td><td>'+staff[i].name+'</td><td>'+staff[i].salary+'</td><td style="color:#f59e0b">'+av+'</td><td><b>'+(staff[i].salary-av)+'</b></td></tr>';}h+='</table></div>';document.getElementById('payTable').innerHTML=h;
}
function renderAv(){
var pend=avances.filter(function(a){return a.status==='PENDING';});
document.getElementById('avStats').textContent='PENDING:'+pend.length+' | TOTAL:'+avances.length;
var h='';for(var i=0;i<avances.length;i++){if(avances[i].status!=='PENDING')continue;h+='<div class="box"><b>'+avances[i].empId+' '+avances[i].empName+'</b> '+avances[i].amount+'<br>'+avances[i].reason+'<br><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button class="btn" style="background:#22c55e" onclick="approveAv(\''+avances[i].id+'\')">EMEZA</button><button class="btn" style="background:#ef4444" onclick="rejectAv(\''+avances[i].id+'\')">ANGA</button></div></div>';}document.getElementById('adminAvList').innerHTML=h||'Nta avance';
}
function approveAv(id){for(var i=0;i<avances.length;i++)if(avances[i].id===id)avances[i].status='APPROVED';renderAll();}
function rejectAv(id){for(var i=0;i<avances.length;i++)if(avances[i].id===id)avances[i].status='REJECTED';renderAll();}
function reqAv(){var u=document.getElementById('u').value.toUpperCase()||'IZP-001';var name=u;for(var i=0;i<staff.length;i++)if(staff[i].id===u)name=staff[i].name;var amt=parseInt(document.getElementById('avAmt').value);if(!amt)return;avances.push({id:'AV-'+(avances.length+1),empId:u,empName:name,amount:amt,reason:document.getElementById('avRs').value||'Avance',status:'PENDING'});renderAll();}
function addStaff(){
var n=document.getElementById('nN').value;var ph=document.getElementById('nPh').value;var pi=document.getElementById('nPi').value;var sa=parseInt(document.getElementById('nSa').value)||100000;var sh=document.getElementById('nSh').value;
if(!n||!ph||!pi){alert('Amazina+Phone+PIN');return;}
var id='IZP-'+String(staff.length+1).padStart(3,'0');staff.push({id:id,name:n,phone:ph,pin:pi,salary:sa,shift:sh,present:false});renderAll();
var p=ph.replace(/[^0-9]/g,'');if(p.startsWith('0'))p='250'+p.slice(1);if(!p.startsWith('250'))p='250'+p;
var msg='Murakaza neza '+id+'! 🎉%0aAmazina:'+encodeURIComponent(n)+'%0aID:'+id+'%0aPhone:'+ph+'%0aShift:'+sh+'%0aSalary:'+sa+'%0aPIN:'+pi;
window.open('https://wa.me/'+p+'?text='+msg,'_blank');alert('✅ '+n+' Yanditswe + WhatsApp!');
}
function openTab(n,b){
var bs=document.querySelectorAll('.nav button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('active');b.classList.add('active');
var ts=['team','time','pay','av','set'];for(var i=0;i<ts.length;i++)document.getElementById(ts[i]+'Tab').style.display=ts[i]===n?'block':'none';
}
</script>
</body>
</html>
