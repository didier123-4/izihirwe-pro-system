<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:#fff;padding:12px}
.card{background:#1e293b;border-radius:12px;padding:14px;margin:10px 0;border-left:4px solid #3b82f6}
.btn{padding:12px;width:100%;border:none;border-radius:8px;font-weight:bold;margin:6px 0;cursor:pointer}
.blue{background:#3b82f6;color:#fff}.green{background:#22c55e;color:#fff}.red{background:#ef4444;color:#fff}.orange{background:#f59e0b;color:#fff}
.input{width:100%;padding:13px;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:8px;margin:7px 0}
.logo{width:90px;height:90px;margin:0 auto 12px;background:linear-gradient(135deg,#f59e0b,#3b82f6);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:bold;box-shadow:0 4px 20px rgba(245,158,11,.4)}
.hidden{display:none}.tab{padding:8px 10px;background:#1e293b;border-radius:8px;display:inline-block;margin:2px;font-size:11px;cursor:pointer}.active{background:#3b82f6}
.day{border-left-color:#f59e0b!important;background:#451a03}.night{border-left-color:#3b82f6!important;background:#1e1b4b}.present{border-left-color:#22c55e!important;background:#14532d}
.badge{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calendar{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.dbox{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:#334155;font-size:10px;cursor:pointer}
.dbox.pre{background:#22c55e}.dbox.off{background:#ef4444;opacity:.7}.dbox.sunwork{background:#22c55e;border:2px solid #f59e0b}
</style>
</head>
