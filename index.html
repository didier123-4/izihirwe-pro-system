<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IZIHIRWE Pro V7.2 FIXED</title>
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#e2e8f0;min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#1e293b;border:1px solid #334155;padding:26px;border-radius:22px;width:100%;max-width:420px;text-align:center}
.logo{width:108px;height:108px;margin:0 auto 12px;display:block;background:#fff;padding:9px;border-radius:20px;object-fit:contain}
input,select{width:100%;padding:13px;border-radius:11px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:10px;font-size:15px;text-align:left}
.btn{width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#0f172a;font-weight:900;cursor:pointer;font-size:15px}
.btn-green{width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-weight:900;cursor:pointer;margin-top:8px}
.btn2{padding:8px 14px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#cbd5e1;cursor:pointer;font-weight:700;font-size:12px}
.active{background:#38bdf8!important;color:#0f172a!important}
#app{display:none}
.header{position:sticky;top:0;z-index:10;background:#0f172af2;backdrop-filter:blur(10px);border-bottom:1px solid #1e293b;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;gap:6px;overflow:auto;padding:10px 12px;background:#0f172a}
.nav button{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:12px;font-weight:700}
.content{padding:12px;max-width:1250px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi>div{background:#1e293b;border:1px solid #334155;padding:12px;border-radius:14px;text-align:left}
.team-card{background:#1e293b;border:1px solid #334155;border-left:5px solid #38bdf8;border-radius:14px;padding:12px;text-align:left}
.badge{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{padding:9px;text-align:center;border-radius:8px;background:#1e293b;border:1px solid #334155;font-size:12px}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:14px;overflow:hidden}
th,td{padding:9px;border-bottom:1px solid #334155;font-size:13px;text-align:left}th{background:#0f172a;color:#94a3b8}
</style>
</head>

<p style="color:#475569;font-size:10px;margin-top:10px">ADMIN/1234 = 6 Dashboards<br>IZP-001/1234 = TIME gusa</p>
</div>
</div>

</div>
