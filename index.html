<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IZIHIRWE Pro V7</title>
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#e2e8f0;min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#1e293b;border:1px solid #334155;padding:28px;border-radius:22px;width:100%;max-width:430px}
.logo{width:110px;height:110px;margin:0 auto 14px;display:block;background:#fff;padding:10px;border-radius:20px}
input,select{width:100%;padding:13px;border-radius:11px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:10px}
.btn{width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#0f172a;font-weight:800;cursor:pointer}
.btn2{padding:9px 14px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#cbd5e1;cursor:pointer;font-weight:700}
.active{background:#38bdf8!important;color:#0f172a!important}
#app{display:none}
.header{position:sticky;top:0;background:#0f172af2;backdrop-filter:blur(10px);border-bottom:1px solid #1e293b;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;gap:7px;overflow:auto;padding:10px 12px}
.nav button{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:12px;font-weight:700}
.content{padding:14px;max-width:1250px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi>div{background:#1e293b;border:1px solid #334155;padding:12px;border-radius:14px}
.team-card{border-left:5px solid #334155;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:12px}
.team-card.day{border-left-color:#fb923c}.team-card.night{border-left-color:#60a5fa}.team-card.present{border-left-color:#22c55e}
.badge{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{padding:8px;text-align:center;border-radius:8px;background:#1e293b;border:1px solid #334155;font-size:12px;cursor:pointer}
.cal div.off{background:#7f1d1d;color:#fca5a5}.cal div.exception{background:#14532d;color:#bbf7d0}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:14px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid #334155;font-size:13px}th{background:#0f172a;color:#94a3b8}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal>div{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:18px;width:100%;max-width:520px}
</style>
</head>
<body>
<div id="loginPage" class="login-wrap">
<div class="card">
<img src="logo.png" class="logo">
<h1 style="text-align:center">IZIHIRWE Pro V7</h1>
<p style="text-align:center;color:#94a3b8;font-size:12px;margin:6px 0 16px">6 Dashboards • Logo • Role Access</p>
<input id="userId" placeholder="ID - ADMIN cyangwa IZP-001" value="ADMIN">
<input id="pin" type="password" placeholder="PIN - 1234" value="1234">
<button class="btn" onclick="doLogin()">INJIRA</button>
<div id="err" style="display:none;margin-top:10px;background
